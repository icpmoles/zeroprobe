name: Build

on:
  push:
    # Skip pushes that only change the documentation site.
    # Path filters are not evaluated for tag pushes, so releases always build.
    paths-ignore:
      - "docs/**"
  # pull_request:
  schedule:
    - cron: "5 4 * * 0"

env:
  FIRMWARE_LIST: |
              zeroprobe/build/zephyr/zephyr.elf
              zeroprobe/build/zephyr/zephyr.uf2

permissions:
  contents: read
  pull-requests: write


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    name: Build app and tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: zeroprobe
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@700109a78599c7bb26585f2fb3d2411d65381b9d
        with:
          app-path: zeroprobe
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ${{ matrix.os }}
          sdk-version: 1.0.1

      - name: Build firmware
        working-directory: zeroprobe
        shell: bash
        run: |
          west build

      - name: Share Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-${{ matrix.os }}-${{ github.event_name }}.${{ github.sha }}
          path: ${{ env.FIRMWARE_LIST }}
          retention-days: 10
              
      - name: Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        if: github.ref_type == 'tag'
        with:
          files: ${{ env.FIRMWARE_LIST }}

      - name: Analyze memory
        id: analyze
        continue-on-error: true
        uses: membrowse/membrowse-action@v1
        with:
          elf:  zeroprobe/build/zephyr/zephyr.elf
          ld:   zeroprobe/build/zephyr/linker.cmd
          map:  zeroprobe/build/zephyr/zephyr.map
          target_name: zeroprobe           # Name for this build target
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}

      - name: Post PR comment
        if: ${{ steps.analyze.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: membrowse/membrowse-action/comment-action@v1
        with:
          json_files: ${{ steps.analyze.outputs.report_path }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
