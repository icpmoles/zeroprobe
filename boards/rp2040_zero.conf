CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# Status LED colors as 0xRRGGBB, keep values low, the WS2812 is very bright
CONFIG_APP_LED_COLOR_UNCONFIGURED=0x200000
CONFIG_APP_LED_COLOR_CONFIGURED=0x000020
CONFIG_APP_LED_COLOR_ACTIVE=0x002000
CONFIG_APP_LED_IDLE_TIMEOUT_MS=500

# RPI PICO binary info, shown by 'picotool info -a'.
CONFIG_RPI_PICO_BINARY_INFO=y
CONFIG_RPI_PICO_BINARY_INFO_OVERRIDE_PROGRAM_NAME="Zeroprobe"
CONFIG_RPI_PICO_BINARY_INFO_OVERRIDE_PROGRAM_DESCRIPTION="CMSIS-DAP debug probe for the Waveshare RP2040-Zero"
CONFIG_RPI_PICO_BINARY_INFO_OVERRIDE_PROGRAM_URL="https://github.com/icpmoles/zeroprobe"
CONFIG_RPI_PICO_BINARY_INFO_PROGRAM_VERSION_STRING=y
CONFIG_RPI_PICO_BINARY_INFO_PIN_CONFIGURATIONS=y